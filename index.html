<script>
const CLIENT_ID = "964660663968-5779his9m7kbr2liukrqu3ohh8sbpaak.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile";

let accessToken = localStorage.getItem('leon_drive_token') || null;
let tokenExpiry = parseInt(localStorage.getItem('leon_drive_expiry')||'0',10);
let googleUser = JSON.parse(localStorage.getItem('leon_google_user')||'null');
let tokenClient = null;
let gisReady = false;

/* ================= GOOGLE IDENTITY SERVICES ================= */
function waitForGIS(cb){
  if(typeof google !== 'undefined' && google.accounts && google.accounts.oauth2){
    cb();
  } else {
    setTimeout(()=>waitForGIS(cb), 200);
  }
}

function initGIS(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp)=>{
      if(resp && resp.access_token){
        setToken(resp.access_token, resp.expires_in);
      }
    }
  });
  gisReady = true;

  // Si hay token guardado pero ya venció, intenta renovar en silencio
  if(accessToken && Date.now() >= tokenExpiry){
    renovarSilencioso();
  } else if(accessToken){
    // Token aún válido: carga datos del usuario
    fetchGoogleUser();
  }
}

function setToken(token, expiresIn){
  accessToken = token;
  const secs = parseInt(expiresIn || '3600', 10);
  tokenExpiry = Date.now() + (secs*1000) - 60000; // 1 minuto de margen
  localStorage.setItem('leon_drive_token', accessToken);
  localStorage.setItem('leon_drive_expiry', tokenExpiry);
  fetchGoogleUser();
}

// Renovación silenciosa (sin mostrar pantalla de Google si ya autorizó antes)
function renovarSilencioso(){
  if(!gisReady || !tokenClient) return Promise.resolve(false);
  return new Promise((resolve)=>{
    let resuelto = false;
    const timer = setTimeout(()=>{ if(!resuelto){ resuelto=true; resolve(false); } }, 8000);
    const origCb = tokenClient.callback;
    tokenClient.callback = (resp)=>{
      if(resuelto) return;
      resuelto = true;
      clearTimeout(timer);
      if(resp && resp.access_token){
        setToken(resp.access_token, resp.expires_in);
        origCb(resp);
        resolve(true);
      } else {
        resolve(false);
      }
    };
    try{
      tokenClient.requestAccessToken({ prompt: '' });
    }catch(e){
      clearTimeout(timer); resuelto=true; resolve(false);
    }
  });
}

// Garantiza token válido antes de usar Drive
async function ensureToken(){
  if(accessToken && Date.now() < tokenExpiry) return true;
  if(!gisReady){
    // Espera un momento a que cargue GIS
    for(let i=0;i<15 && !gisReady;i++) await new Promise(r=>setTimeout(r,200));
  }
  const ok = await renovarSilencioso();
  return ok;
}

async function fetchGoogleUser(){
 if(!accessToken) return;
 try{
   const res = await fetch("https://www.googleapis.com/oauth2/v2/userinfo", {
     headers:{'Authorization':'Bearer '+accessToken}
   });
   if(res.status===401){
     // token inválido: intenta renovar y reintenta
     const ok = await renovarSilencioso();
     if(ok) return fetchGoogleUser();
     return;
   }
   const text = await res.text();
   if(text.trim().startsWith("<")) throw new Error("html");
   const u = JSON.parse(text);
   googleUser = u;
   localStorage.setItem('leon_google_user', JSON.stringify(u));
   document.getElementById('googleInfo').innerText = "✅ " + u.email;
   document.getElementById('driveStatus').innerText = "✅ Conectado: " + u.email;
   document.getElementById('r_correo').value = u.email;
   if(!document.getElementById('r_nombre').value) document.getElementById('r_nombre').value = u.name || "";
   if(perfil){
     perfil.correo = u.email;
     if(!perfil.nombre) perfil.nombre = u.name;
     localStorage.setItem(LS_PERFIL, JSON.stringify(perfil));
     mostrarPerfil();
   }
 }catch(e){
   console.log("userinfo error", e);
 }
}

function conectarDrive(){
  if(!gisReady){
    alert('Cargando Google... intenta de nuevo en un momento.');
    return;
  }
  // Al pulsar manualmente sí pedimos consentimiento
  tokenClient.callback = (resp)=>{
    if(resp && resp.access_token){
      setToken(resp.access_token, resp.expires_in);
    }
  };
  tokenClient.requestAccessToken({ prompt: 'consent' });
}
/* ============================================================= */

async function guardarEnDrive(){
 const ok = await ensureToken();
 if(!ok){
   // No hay token válido: pide permiso al usuario
   if(confirm("Tu sesión de Google expiró. ¿Reconectar ahora?")) conectarDrive();
   return;
 }
 const data = {perfil:perfil, historial:historial, fecha:new Date().toISOString(), googleUser:googleUser};
 const fileContent = JSON.stringify(data);
 let fileId = localStorage.getItem('leon_drive_fileId');
 try{
  document.getElementById('driveStatus').innerText="Guardando...";
  let res, text;
  if(fileId){
   res = await fetch("https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=media", {
    method:'PATCH',
    headers:{'Authorization':'Bearer '+accessToken, 'Content-Type':'application/json'},
    body: fileContent
   });
   text = await res.text();
   if(res.status===401){
     // intenta renovar y reintentar una vez
     const ok2 = await renovarSilencioso();
     if(ok2){
       res = await fetch("https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=media", {
        method:'PATCH',
        headers:{'Authorization':'Bearer '+accessToken, 'Content-Type':'application/json'},
        body: fileContent
       });
       text = await res.text();
     }
   }
   if(!res.ok || text.trim().startsWith("<")) throw new Error("Token expirado");
  } else {
   const metadata = {name:'LeonCar_backup.json', mimeType:'application/json'};
   const form = new FormData();
   form.append('metadata', new Blob([JSON.stringify(metadata)],{type:'application/json'}));
   form.append('file', new Blob([fileContent],{type:'application/json'}));
   res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method:'POST',
    headers:{'Authorization':'Bearer '+accessToken},
    body: form
   });
   if(res.status===401){
     const ok2 = await renovarSilencioso();
     if(ok2){
       const form2 = new FormData();
       form2.append('metadata', new Blob([JSON.stringify(metadata)],{type:'application/json'}));
       form2.append('file', new Blob([fileContent],{type:'application/json'}));
       res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method:'POST',
        headers:{'Authorization':'Bearer '+accessToken},
        body: form2
       });
     }
   }
   text = await res.text();
   if(!res.ok || text.trim().startsWith("<")) throw new Error("Token expirado");
   const json = JSON.parse(text);
   if(json.id) localStorage.setItem('leon_drive_fileId', json.id);
  }
  document.getElementById('driveStatus').innerText="✅ Guardado: "+new Date().toLocaleString();
 }catch(e){
  document.getElementById('driveStatus').innerText="❌ Reconecta Google";
 }
}

async function restaurarDeDrive(){
 const ok = await ensureToken();
 if(!ok){
   if(confirm("Tu sesión de Google expiró. ¿Reconectar ahora?")) conectarDrive();
   return;
 }
 try{
  document.getElementById('driveStatus').innerText="Buscando...";
  const q = encodeURIComponent("name='LeonCar_backup.json' and trashed=false");
  let resList = await fetch("https://www.googleapis.com/drive/v3/files?q=" + q + "&fields=files(id,name)", {
   headers:{'Authorization':'Bearer '+accessToken}
  });
  if(resList.status===401){
    const ok2 = await renovarSilencioso();
    if(!ok2){ alert("Reconecta Google"); return; }
    resList = await fetch("https://www.googleapis.com/drive/v3/files?q=" + q + "&fields=files(id,name)", {
     headers:{'Authorization':'Bearer '+accessToken}
    });
  }
  const text = await resList.text();
  if(text.trim().startsWith("<")) throw new Error("Token expirado");
  const list = JSON.parse(text);
  if(!list.files || list.files.length===0){ alert("No hay backup en Drive"); return; }
  const fileId = list.files[0].id;
  localStorage.setItem('leon_drive_fileId', fileId);
  const res = await fetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media", {
   headers:{'Authorization':'Bearer '+accessToken}
  });
  const data = await res.json();
  if(confirm("Restaurar backup del " + new Date(data.fecha).toLocaleString() + " con " + data.historial.length + " días?")){
   localStorage.setItem(LS_PERFIL, JSON.stringify(data.perfil));
   localStorage.setItem(LS_HIST, JSON.stringify(data.historial));
   perfil=data.perfil; historial=data.historial;
   init(); document.getElementById('driveStatus').innerText="✅ Restaurado";
  }
 }catch(e){ alert("Error: "+e.message); }
}

const LS_PERFIL='leon_v17_perfil';
const LS_JORNADA='leon_v17_jornada';
const LS_HIST='leon_v17_hist';
let perfil=JSON.parse(localStorage.getItem(LS_PERFIL)||'null');
let jornada=JSON.parse(localStorage.getItem(LS_JORNADA)||'null');
let historial=JSON.parse(localStorage.getItem(LS_HIST)||'[]');
let modoFinal='manual';
let watchId=null; let lastPos=null; let gpsKmAcumulado=0;

/* ================= VALIDACIÓN DE VENCIMIENTOS ================= */
function parseCaducidad(v){
  if(!v) return null;
  const m = String(v).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(!m) return null;
  let d=+m[1], mo=+m[2], y=+m[3];
  if(y<100) y += 2000;
  if(mo<1||mo>12||d<1||d>31) return null;
  const f = new Date(y, mo-1, d, 23, 59, 59);
  if(f.getFullYear()!==y || f.getMonth()!==mo-1 || f.getDate()!==d) return null;
  return f;
}
function parseMatricula(v){
  if(!v) return null;
  const m = String(v).trim().match(/^(\d{1,2})[\/\-.](\d{4})$/);
  if(!m) return null;
  const mo=+m[1], y=+m[2];
  if(mo<1||mo>12) return null;
  return new Date(y, mo, 0, 23, 59, 59);
}
function vencido(valor, tipo){
  const f = (tipo==='cad') ? parseCaducidad(valor) : parseMatricula(valor);
  if(!f) return false;
  return f.getTime() < Date.now();
}
function marcarVencimientos(){
  const cadIn = document.getElementById('r_cad');
  const matIn = document.getElementById('r_matri');
  if(cadIn)  cadIn.classList.toggle('caducado',  vencido(cadIn.value,  'cad'));
  if(matIn)  matIn.classList.toggle('caducado',  vencido(matIn.value, 'matri'));
  if(perfil) mostrarPerfil();
}
/* ============================================================= */

/* ================= SOLO ENTEROS EN KILOMETRAJE ================= */
function soloEnteros(el){
  if(!el) return;
  el.addEventListener('input', ()=>{
    const limpio = el.value.replace(/[^\d]/g,'');
    if(el.value !== limpio) el.value = limpio;
  });
  el.addEventListener('keydown', (e)=>{
    const permitidas = ['Backspace','Delete','ArrowLeft','ArrowRight','Tab','Home','End','Enter'];
    if(permitidas.includes(e.key)) return;
    if(e.ctrlKey||e.metaKey) return;
    if(!/^\d$/.test(e.key)) e.preventDefault();
  });
  el.addEventListener('paste', (e)=>{
    e.preventDefault();
    const t = (e.clipboardData||window.clipboardData).getData('text')||'';
    el.value = t.replace(/[^\d]/g,'');
  });
}
function toInt(v){ const n = parseInt(String(v).replace(/[^\d]/g,''),10); return isNaN(n)?0:n; }
/* ============================================================== */

function guardarRegistro(){
 const data={
  nombre:document.getElementById('r_nombre').value.trim(),
  tel:document.getElementById('r_tel').value.trim(),
  placa:document.getElementById('r_placa').value.trim().toUpperCase(),
  correo:(googleUser && googleUser.email) ? googleUser.email : document.getElementById('r_correo').value.trim().toLowerCase(),
  rend:parseFloat(document.getElementById('r_rend').value),
  precio:parseFloat(document.getElementById('r_precio').value),
  marca:document.getElementById('r_marca').value.trim(),
  cad:document.getElementById('r_cad').value.trim(),
  matri:document.getElementById('r_matri').value.trim()
 };
 if(!data.nombre||!data.placa||!data.rend||!data.precio) return alert('Completa nombre, placa, rendimiento y precio');
 perfil=data; localStorage.setItem(LS_PERFIL, JSON.stringify(perfil)); init();
}
function mostrarPerfil(){ 
  const emailTxt = perfil.correo ? perfil.correo : (googleUser?googleUser.email:"");
  let html = perfil.nombre + " - " + perfil.placa + "<br>" + emailTxt + " - Rend: " + perfil.rend;

  if(perfil.cad){
    const v = vencido(perfil.cad,'cad');
    html += "<br>Licencia: <span class='" + (v?'txt-caducado':'') + "'>" + perfil.cad + "</span>";
  }
  if(perfil.matri){
    const v = vencido(perfil.matri,'matri');
    html += "<br>Matrícula: <span class='" + (v?'txt-caducado':'') + "'>" + perfil.matri + "</span>";
  }
  document.getElementById('profileView').innerHTML = html;
}
function editarRegistro(){
 document.getElementById('r_nombre').value=perfil.nombre;
 document.getElementById('r_tel').value=perfil.tel;
 document.getElementById('r_placa').value=perfil.placa;
 document.getElementById('r_correo').value=perfil.correo;
 document.getElementById('r_rend').value=perfil.rend;
 document.getElementById('r_precio').value=perfil.precio;
 document.getElementById('r_marca').value=perfil.marca;
 document.getElementById('r_cad').value=perfil.cad||'';
 document.getElementById('r_matri').value=perfil.matri||'';
 document.getElementById('registroCard').classList.remove('hidden');
 document.getElementById('appCard').classList.add('hidden');
 marcarVencimientos();
}
function init(){
 if(perfil){
  document.getElementById('registroCard').classList.add('hidden');
  document.getElementById('appCard').classList.remove('hidden');
  mostrarPerfil(); updateUI();
 } else {
  document.getElementById('registroCard').classList.remove('hidden');
  document.getElementById('appCard').classList.add('hidden');
  if(googleUser) document.getElementById('r_correo').value = googleUser.email;
 }
 render();
 marcarVencimientos();
}
function iniciarJornada(){
 const km=toInt(document.getElementById('kmIni').value);
 if(!km) return alert('Ingresa km');
 jornada={A:km, gpsKm:0};
 localStorage.setItem(LS_JORNADA, JSON.stringify(jornada));
 document.getElementById('kmIni').value='';
 updateUI(); iniciarGPS();
}
function updateUI(){
 const enCurso=!!jornada;
 if(!perfil) return;
 document.getElementById('cardInicio').classList.toggle('hidden', enCurso);
 document.getElementById('cardFin').classList.toggle('hidden',!enCurso);
 document.getElementById('estadoTxt').innerText=enCurso?'En curso':'Sin jornada';
 if(enCurso){
  document.getElementById('kA').innerText=jornada.A+' km';
  gpsKmAcumulado=jornada.gpsKm||0;
  document.getElementById('kGps').innerText=Math.round(gpsKmAcumulado)+' km';
  calcular();
 }
}
function iniciarGPS(){
 if(!navigator.geolocation) return;
 if(watchId!==null) navigator.geolocation.clearWatch(watchId);
 gpsKmAcumulado=jornada.gpsKm||0; lastPos=null;
 watchId=navigator.geolocation.watchPosition(pos=>{
   const lat=pos.coords.latitude; const lng=pos.coords.longitude;
   if(lastPos){
    const d=haversine(lastPos.lat,lastPos.lng,lat,lng);
    if(d>0.01 && d<2) gpsKmAcumulado+=d;
   }
   lastPos={lat,lng}; jornada.gpsKm=gpsKmAcumulado;
   localStorage.setItem(LS_JORNADA, JSON.stringify(jornada));
   document.getElementById('kGps').innerText=Math.round(gpsKmAcumulado)+' km';
   if(modoFinal==='gps') calcular();
 },null,{enableHighAccuracy:true});
}
function haversine(lat1,lon1,lat2,lon2){
 const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180;
 const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function setModo(m){
 modoFinal=m;
 document.getElementById('btnManual').classList.toggle('active',m==='manual');
 document.getElementById('btnGps').classList.toggle('active',m==='gps');
 document.getElementById('kmFin').readOnly=(m==='gps');
 calcular();
}
function calcular(){
 if(!jornada||!perfil) return;
 const A=jornada.A;
 let B;
 if(modoFinal==='gps'){
   B = A + Math.round(gpsKmAcumulado);
   document.getElementById('kmFin').value = B;
 } else {
   B = toInt(document.getElementById('kmFin').value);
   if(!B) B = A;
 }
 const C=parseFloat(document.getElementById('ingresos').value)||0;
 const F=parseFloat(document.getElementById('otros').value)||0;
 const rec=B-A; const recValido=rec>0?rec:0;
 const D=recValido>0? (recValido / perfil.rend) * perfil.precio : 0;
 const E=C-D-F;
 document.getElementById('kRec').innerText=Math.round(recValido)+' km';
 document.getElementById('comb').value=D>0? D.toFixed(2) : '';
 document.getElementById('kE').innerText="$" + E.toFixed(2);
}
['kmFin','ingresos','otros'].forEach(id=>{ document.getElementById(id).addEventListener('input',calcular); });

['r_cad','r_matri'].forEach(id=>{
  const el=document.getElementById(id);
  if(el){ el.addEventListener('input',marcarVencimientos); el.addEventListener('change',marcarVencimientos); }
});

soloEnteros(document.getElementById('kmIni'));
soloEnteros(document.getElementById('kmFin'));

function limpiarCamposTemporales(){
  document.getElementById('kmIni').value='';
  document.getElementById('kmFin').value='';
  document.getElementById('ingresos').value='';
  document.getElementById('otros').value='';
  document.getElementById('detalle').value='';
  document.getElementById('comb').value='';
}

function finalizarJornada(){
 const C=parseFloat(document.getElementById('ingresos').value)||0;
 const F=parseFloat(document.getElementById('otros').value)||0;
 const detalle=document.getElementById('detalle').value.trim();
 let B = (modoFinal==='gps') ? jornada.A + Math.round(gpsKmAcumulado) : toInt(document.getElementById('kmFin').value);
 if(!B || B<=jornada.A){ alert('Km final debe ser mayor'); return; }
 const rec=B-jornada.A; const D=(rec/perfil.rend)*perfil.precio; const E=C-D-F;
 historial.unshift({fecha:new Date().toISOString(), A:jornada.A, B:B, rec:rec, C:C, D:D, F:F, E:E, detalle:detalle});
 localStorage.setItem(LS_HIST, JSON.stringify(historial));
 if(watchId!==null) navigator.geolocation.clearWatch(watchId);
 localStorage.removeItem(LS_JORNADA); jornada=null; gpsKmAcumulado=0;

 limpiarCamposTemporales();
 updateUI(); render(); 
 guardarEnDrive();

 setTimeout(()=>{
   const el = document.getElementById('kmIni');
   if(el){
     el.focus({preventScroll:false});
     el.select();
   }
 }, 80);
}
function render(){
 const tbody=document.getElementById('tbodyHist'); tbody.innerHTML='';
 historial.forEach(r=>{
  const ingresos = r.C || 0;
  const gastos = (r.D || 0) + (r.F || 0);
  const ganancia = r.E || 0;
  const tr=document.createElement('tr');
  tr.innerHTML =
    "<td>" + new Date(r.fecha).toLocaleDateString() + "</td>" +
    "<td style='color:#22c55e'>$" + ingresos.toFixed(2) + "</td>" +
    "<td style='color:#ef4444'>$" + gastos.toFixed(2) + "</td>" +
    "<td style='color:" + (ganancia>=0?'#22c55e':'#ef4444') + ";font-weight:800'>$" + ganancia.toFixed(2) + "</td>";
  tbody.appendChild(tr);
 });
}
function borrarHistorial(){ if(confirm('¿Borrar?')){ localStorage.removeItem(LS_HIST); historial=[]; render(); } }
